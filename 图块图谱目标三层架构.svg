<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">图块知识图谱目标三层架构</title>
  <desc id="desc">三层架构图。实线是已有关系，虚线是规划正式关系，点划线是尚未确认的候选关系。RecognitionRun 和 SectionLabelAliasRule 均位于核心知识图谱之外。</desc>
  <defs>
    <marker id="a0" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#334155"/></marker>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#7c3aed"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#c2410c"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#526079}
      .lt{font-size:21px;font-weight:700}.ln{font-size:13px;fill:#64748b}
      .nt{font-size:15px;font-weight:700;text-anchor:middle}.nn{font-size:12px;fill:#526079;text-anchor:middle}
      .el{font-size:12px;font-weight:600;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
      .small{font-size:12px;fill:#526079}.panel{stroke-width:1.5}.sem{fill:#faf5ff;stroke:#d8b4fe}.spa{fill:#f0fdf4;stroke:#86efac}.src{fill:#eef6ff;stroke:#93c5fd}
      .ext{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}
      .ns{fill:#fff;stroke:#3b82f6;stroke-width:1.8}.np{fill:#fff;stroke:#16a34a;stroke-width:1.8}.ne{fill:#fff;stroke:#8b5cf6;stroke-width:1.8}.nc{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8}
      .existing{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#a0)}
      .planned{fill:none;stroke:#7c3aed;stroke-width:2.2;stroke-dasharray:8 7;marker-end:url(#a1)}
      .conditional{fill:none;stroke:#c2410c;stroke-width:2.2;stroke-dasharray:12 5 2 5;marker-end:url(#a2)}
      .reference{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:2 6;marker-end:url(#a3)}
      .divider{stroke:#d8b4fe;stroke-width:1.2;stroke-dasharray:4 5}
    </style>
  </defs>

  <rect width="1600" height="1180" fill="#fff"/>
  <text x="50" y="48" class="title">图块知识图谱目标三层架构</text>
  <text x="50" y="75" class="subtitle">来源事实、空间派生关系与多模态语义证据分层保存；同名来源元素在各层中指向同一个实际节点</text>

  <line x1="70" y1="112" x2="130" y2="112" class="existing"/><text x="145" y="117" class="small">已有关系</text>
  <line x1="245" y1="112" x2="305" y2="112" class="planned"/><text x="320" y="117" class="small">规划关系</text>
  <line x1="420" y1="112" x2="480" y2="112" class="conditional"/><text x="495" y="117" class="small">CANDIDATE_* 候选关系</text>
  <line x1="690" y1="112" x2="750" y2="112" class="reference"/><text x="765" y="117" class="small">外部日志引用，不是图关系</text>

  <!-- 语义证据层 -->
  <rect x="35" y="145" width="1530" height="420" rx="18" class="panel sem"/>
  <text x="60" y="180" class="lt">语义证据层</text>
  <text x="60" y="203" class="ln">模型观察和解析可缓存、可追溯，但不会覆盖来源事实</text>
  <line x1="785" y1="220" x2="785" y2="540" class="divider"/>
  <text x="80" y="238" class="ln">通用识别证据链</text>
  <text x="820" y="238" class="ln">CrossSection 与 BlockCaption 的断面匹配链</text>

  <!-- 外部日志模块 -->
  <rect x="790" y="18" width="370" height="105" rx="14" class="ext"/>
  <text x="812" y="48" class="lt">图谱外部：识别运行日志</text>
  <text x="812" y="73" class="small">RecognitionRun 不建节点；保存 run_id、版本、状态和错误</text>
  <text x="812" y="96" class="small">仅真实模型调用写日志；缓存命中不新增运行记录</text>
  <rect x="1180" y="18" width="370" height="105" rx="14" class="ext"/>
  <text x="1202" y="48" class="lt">图谱外部：版本化规则配置</text>
  <text x="1202" y="73" class="small">SectionLabelAliasRule 不建节点；保存作用域、状态和版本</text>
  <text x="1202" y="96" class="small">关系边只引用 alias_rule_id 与 alias_rule_version</text>

  <!-- 通用证据 -->
  <rect x="75" y="285" width="170" height="70" rx="12" class="ns"/>
  <text x="160" y="313" class="nt">来源元素</text><text x="160" y="337" class="nn">Block / Table / BasicInfo 等</text>
  <rect x="330" y="270" width="210" height="100" rx="12" class="ne"/>
  <text x="435" y="302" class="nt">TextObservation</text><text x="435" y="327" class="nn">原文、规范化文字、bbox</text><text x="435" y="349" class="nn">run_id · cache_key · version</text>
  <rect x="600" y="270" width="155" height="100" rx="12" class="ne"/>
  <text x="677" y="302" class="nt">Interpretation</text><text x="677" y="327" class="nn">Block / BasicInfo</text><text x="677" y="349" class="nn">Table 结构化解析</text>
  <path d="M245 310H330" class="planned"/><text x="287" y="297" class="el">HAS_OBSERVATION</text>
  <path d="M245 345C370 440 560 430 625 370" class="planned"/><text x="430" y="428" class="el">HAS_INTERPRETATION</text>
  <path d="M600 320H540" class="planned"/><text x="570" y="306" class="el">SUPPORTED_BY</text>
  <path d="M975 123C820 170 650 205 500 270" class="reference"/><text x="725" y="187" class="el">通过 run_id 回查日志</text>

  <!-- 断面匹配 -->
  <rect x="820" y="275" width="175" height="68" rx="12" class="ns"/>
  <text x="907" y="303" class="nt">CrossSection</text><text x="907" y="326" class="nn">同一物理标记区域</text>
  <rect x="820" y="435" width="175" height="68" rx="12" class="ns"/>
  <text x="907" y="463" class="nt">BlockCaption</text><text x="907" y="486" class="nn">完整标题区域</text>
  <rect x="1080" y="275" width="185" height="68" rx="12" class="ne"/>
  <text x="1172" y="303" class="nt">TextObservation</text><text x="1172" y="326" class="nn">端点标签与逻辑键</text>
  <rect x="1080" y="435" width="185" height="68" rx="12" class="ne"/>
  <text x="1172" y="463" class="nt">TextObservation</text><text x="1172" y="486" class="nn">标题文字与逻辑键</text>
  <path d="M995 309H1080" class="planned"/><text x="1037" y="296" class="el">HAS_OBSERVATION</text>
  <path d="M995 469H1080" class="planned"/><text x="1037" y="456" class="el">HAS_OBSERVATION</text>
  <path d="M855 343V435" class="planned"/>
  <text x="842" y="378" class="el" style="text-anchor:end">MATCHES_SECTION_CAPTION</text><text x="842" y="399" class="nn" style="text-anchor:end">唯一、无冲突时正式建边</text>
  <path d="M960 343V435" class="conditional"/>
  <text x="973" y="372" class="el" style="text-anchor:start">CANDIDATE_MATCHES_</text><text x="973" y="391" class="el" style="text-anchor:start">SECTION_CAPTION</text><text x="973" y="412" class="nn" style="text-anchor:start">多候选或存在冲突</text>

  <rect x="1320" y="278" width="210" height="205" rx="12" class="ext"/>
  <text x="1425" y="308" class="nt">关系属性（不是节点）</text>
  <text x="1342" y="338" class="small">status / score</text>
  <text x="1342" y="361" class="small">candidate_count</text>
  <text x="1342" y="384" class="small">conflict_reason</text>
  <text x="1342" y="407" class="small">observation_ids</text>
  <text x="1342" y="430" class="small">rule_version</text>
  <text x="1342" y="453" class="small">alias_rule_id / version</text>
  <path d="M1365 123C1380 180 1400 225 1415 278" class="reference"/><text x="1445" y="205" class="el">读取规则配置</text>

  <!-- 空间关系层 -->
  <rect x="35" y="590" width="1530" height="220" rx="18" class="panel spa"/>
  <text x="60" y="625" class="lt">空间关系层</text>
  <text x="60" y="648" class="ln">简单、唯一、无规则冲突时直接建立正式关系；多候选或冲突时建立带判断属性的 CANDIDATE_* 候选边</text>

  <rect x="110" y="690" width="165" height="62" rx="12" class="ns"/><text x="192" y="727" class="nt">DrawingBlock</text>
  <rect x="405" y="690" width="165" height="62" rx="12" class="ns"/><text x="487" y="727" class="nt">BlockCaption</text>
  <path d="M275 721H405" class="existing"/><text x="340" y="707" class="el">HAS_CAPTION</text>
  <path d="M405 744C360 787 320 787 275 744" class="conditional"/><text x="340" y="788" class="el">CANDIDATE_CAPTION_OF</text>

  <rect x="650" y="690" width="165" height="62" rx="12" class="ns"/><text x="732" y="727" class="nt">DrawingBlock</text>
  <rect x="950" y="690" width="165" height="62" rx="12" class="ns"/><text x="1032" y="727" class="nt">CrossSection</text>
  <path d="M815 721H950" class="existing"/><text x="882" y="707" class="el">HAS_SECTION_MARK</text>
  <path d="M815 744C850 787 915 787 950 744" class="conditional"/><text x="882" y="788" class="el">CANDIDATE_HAS_SECTION_MARK</text>

  <rect x="1190" y="675" width="165" height="62" rx="12" class="ns"/><text x="1272" y="712" class="nt">DrawingPage</text>
  <rect x="1190" y="750" width="205" height="46" rx="12" class="ns"/><text x="1292" y="779" class="nt">DrawingBasicInfo</text>
  <path d="M1272 737V750" class="planned"/><text x="1415" y="747" class="el">USES_BASIC_INFO</text>

  <!-- 来源事实层 -->
  <rect x="35" y="835" width="1530" height="250" rx="18" class="panel src"/>
  <text x="60" y="870" class="lt">来源事实层</text>
  <text x="60" y="893" class="ln">来自原始 JSON、图片、稳定业务 ID 和 bbox；只记录图纸中实际存在的页面与元素</text>

  <rect x="75" y="935" width="145" height="60" rx="12" class="ns"/><text x="147" y="972" class="nt">Project</text>
  <rect x="280" y="935" width="160" height="60" rx="12" class="ns"/><text x="360" y="972" class="nt">DrawingSet</text>
  <rect x="505" y="935" width="170" height="60" rx="12" class="ns"/><text x="590" y="972" class="nt">DrawingPage</text>
  <path d="M220 965H280" class="existing"/><text x="250" y="951" class="el">HAS_SET</text>
  <path d="M440 965H505" class="existing"/><text x="472" y="951" class="el">HAS_PAGE</text>

  <rect x="770" y="900" width="155" height="55" rx="12" class="ns"/><text x="847" y="934" class="nt">DrawingBlock</text>
  <rect x="770" y="990" width="155" height="55" rx="12" class="ns"/><text x="847" y="1024" class="nt">BlockCaption</text>
  <rect x="1000" y="900" width="165" height="55" rx="12" class="ns"/><text x="1082" y="934" class="nt">CrossSection</text>
  <rect x="1000" y="990" width="190" height="55" rx="12" class="ns"/><text x="1095" y="1024" class="nt">DrawingBasicInfo</text>
  <rect x="1250" y="900" width="125" height="55" rx="12" class="ns"/><text x="1312" y="934" class="nt">Table</text>
  <rect x="1250" y="990" width="245" height="55" rx="12" class="ns"/><text x="1372" y="1014" class="nt">其他页面元素</text><text x="1372" y="1035" class="nn">Title / PlainText / Caption 等</text>

  <path d="M675 950C710 930 730 927 770 927" class="existing"/><text x="720" y="914" class="el">HAS_BLOCK</text>
  <path d="M675 968C710 1010 730 1017 770 1017" class="existing"/><text x="716" y="1002" class="el">HAS_ELEMENT</text>
  <path d="M675 945C790 870 930 880 1000 927" class="existing"/><text x="846" y="875" class="el">HAS_ELEMENT</text>
  <path d="M675 976C800 1070 930 1060 1000 1017" class="existing"/><text x="850" y="1067" class="el">HAS_BASIC_INFO</text>
  <path d="M675 940C910 840 1140 855 1250 927" class="existing"/><text x="1080" y="854" class="el">HAS_TABLE</text>
  <path d="M675 982C900 1110 1150 1085 1250 1017" class="existing"/><text x="1090" y="1082" class="el">HAS_ELEMENT</text>

  <!-- 缓存键 -->
  <rect x="55" y="1110" width="1490" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="75" y="1140" class="small">缓存键 = Hash（图片内容哈希 + bbox + 任务类型 + 模型/提示词版本 + 图像预处理/规范化规则版本 + 数据契约版本）；缓存键是证据属性，不是图节点</text>
</svg>
